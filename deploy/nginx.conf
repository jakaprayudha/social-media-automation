# Example: adapt domain, absolute paths, TLS certificates and PHP socket.
log_format ruang_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name social.example.com;
    return 301 https://social.example.com$uri;
}

server {
    listen 443 ssl;
    server_name social.example.com;
    root /srv/ruang-social/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/social.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ruang-social.access.log ruang_safe;
    # Nginx error logs may include request queries. Do not retain/debug them for token routes.
    error_log /var/log/nginx/ruang-social.error.log crit;
    client_max_body_size 16k;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
